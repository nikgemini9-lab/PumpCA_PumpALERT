# render.yaml — Render.com deployment (alternative to Fly.io)
# Free tier web services spin down after 15 min without traffic.
# Prevent this by using UptimeRobot (free) to ping /health every 5 minutes.

services:
  - type: web
    name: pump-alert
    runtime: node
    region: oregon
    plan: free
    # npm ci is faster than npm install on Render (uses package-lock.json exactly)
    # --prefer-offline uses the npm cache layer; SKIP_PREFLIGHT_CHECK avoids CRA checks
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/src/data/pump_alert.db
      # ── Telegram ─────────────────────────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NIK_CHAT_ID         # Nik's Telegram chat ID (send /start to get it)
        sync: false
      - key: JOSH_CHAT_ID        # Josh's Telegram chat ID
        sync: false
      - key: TELEGRAM_CHAT_ID    # Legacy fallback (if NIK_CHAT_ID not set)
        sync: false

      # ── Solana / Helius ───────────────────────────────────────────────────────
      - key: HELIUS_API_KEY
        sync: false

      # ── Dashboard & Helius Webhooks ───────────────────────────────────────────
      - key: APP_URL
        value: https://pumpca-pumpalert.onrender.com
      - key: DASHBOARD_SECRET    # Web dashboard password + Helius webhook auth
        sync: false

      # ── Alert thresholds ──────────────────────────────────────────────────────
      - key: PRICE_CHANGE_ALERT_PERCENT
        value: "15"
      - key: BUY_COUNT_ALERT
        value: "5"
      - key: ALERT_COOLDOWN_MINUTES
        value: "10"
