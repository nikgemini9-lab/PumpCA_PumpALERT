<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PumpALERT Dashboard</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #12121a;
      --bg3: #1a1a26;
      --border: #2a2a3d;
      --green: #00d084;
      --green-dim: #00d08422;
      --red: #ff4757;
      --red-dim: #ff475722;
      --yellow: #ffd32a;
      --blue: #4a9eff;
      --text: #e0e0f0;
      --text-dim: #7070a0;
      --text-muted: #404060;
      --radius: 10px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'SF Pro Display', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── LOGIN SCREEN ──────────────────────────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
    }

    .login-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 340px;
      text-align: center;
    }

    .login-box h1 { font-size: 22px; margin-bottom: 6px; color: var(--green); }
    .login-box p { color: var(--text-dim); margin-bottom: 24px; font-size: 13px; }

    .login-box input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    .login-box input:focus { border-color: var(--green); }

    .btn-primary {
      background: var(--green);
      color: #000;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }

    #login-error {
      color: var(--red);
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    /* ── MAIN APP ──────────────────────────────────────────────── */
    #app { display: none; }

    /* ── HEADER ──────────────────────────────────────────────── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 18px; font-weight: 700; color: var(--green); letter-spacing: -0.3px; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--green-dim);
      border: 1px solid var(--green);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--green);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .sync-info {
      color: var(--text-dim);
      font-size: 12px;
    }

    .btn-icon {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-icon:hover { color: var(--text); border-color: var(--text-dim); }

    /* ── MAIN GRID ───────────────────────────────────────────── */
    main {
      padding: 20px 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .grid-top {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 1100px) {
      .grid-top { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      .grid-top { grid-template-columns: 1fr; }
    }

    /* ── PANELS ──────────────────────────────────────────────── */
    .panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .badge {
      background: var(--bg3);
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .panel-body {
      padding: 12px;
      flex: 1;
      overflow-y: auto;
      max-height: 440px;
    }

    .panel-footer {
      border-top: 1px solid var(--border);
      padding: 10px 12px;
    }

    /* ── EMPTY STATE ─────────────────────────────────────────── */
    .empty {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 24px 0;
    }

    /* ── WALLET CARD ─────────────────────────────────────────── */
    .wallet-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .wallet-card:hover { border-color: var(--text-dim); }
    .wallet-card.active { border-color: var(--green); background: var(--green-dim); }

    .wallet-label {
      font-size: 13px;
      font-weight: 600;
      text-transform: capitalize;
      margin-bottom: 4px;
    }

    .wallet-addr {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-dim);
      word-break: break-all;
    }

    .wallet-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .wallet-count {
      font-size: 11px;
      color: var(--text-dim);
    }

    .btn-remove {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-remove:hover { border-color: var(--red); color: var(--red); }

    /* ── ADD FORM ────────────────────────────────────────────── */
    .add-form {
      display: flex;
      gap: 6px;
    }

    .add-form input, .add-form select {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
      min-width: 0;
    }

    .add-form input:focus, .add-form select:focus { border-color: var(--green); }
    .add-form select { flex: 0 0 80px; }

    .btn-add {
      background: var(--green);
      color: #000;
      border: none;
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .btn-add:hover { opacity: 0.85; }

    /* ── TOKEN ROW ───────────────────────────────────────────── */
    .token-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 8px;
      border-radius: var(--radius-sm);
      transition: background 0.1s;
      border-bottom: 1px solid var(--border);
    }
    .token-row:last-child { border-bottom: none; }
    .token-row:hover { background: var(--bg3); }

    .token-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      flex-shrink: 0;
    }

    .token-info { flex: 1; min-width: 0; }
    .token-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .token-mint {
      font-family: monospace;
      font-size: 10px;
      color: var(--text-dim);
    }

    .token-price {
      text-align: right;
      flex-shrink: 0;
    }
    .token-price .price { font-size: 13px; font-weight: 600; }
    .token-price .mc { font-size: 11px; color: var(--text-dim); }

    .tag {
      font-size: 10px;
      border-radius: 4px;
      padding: 2px 5px;
      font-weight: 600;
    }
    .tag-wallet { background: #7c5cfc22; color: #a78bfa; border: 1px solid #7c5cfc44; }
    .tag-manual { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }

    /* ── ALERTS SECTION ──────────────────────────────────────── */
    .alerts-panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .alert-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .alert-row:last-child { border-bottom: none; }
    .alert-row:hover { background: var(--bg3); }

    .alert-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    .alert-info { flex: 1; }
    .alert-token { font-size: 13px; font-weight: 600; }
    .alert-type { font-size: 11px; color: var(--text-dim); }

    .alert-time {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ── HOLDINGS PANEL ──────────────────────────────────────── */
    .holdings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .wallet-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .wallet-tab {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: capitalize;
    }
    .wallet-tab:hover { color: var(--text); }
    .wallet-tab.active {
      background: var(--green-dim);
      border-color: var(--green);
      color: var(--green);
    }

    /* ── SCROLL ──────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── TOAST ───────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg3);
      border: 1px solid var(--green);
      border-radius: var(--radius-sm);
      color: var(--green);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s;
      pointer-events: none;
      z-index: 9999;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    #toast.error {
      border-color: var(--red);
      color: var(--red);
    }

    /* ── SPINNER ─────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── LOGIN SCREEN ─────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <h1>🚀 PumpALERT</h1>
    <p>Enter your dashboard password to continue</p>
    <input id="login-input" type="password" placeholder="Password" autocomplete="current-password" />
    <button class="btn-primary" onclick="doLogin()">Sign In</button>
    <div id="login-error">Incorrect password</div>
  </div>
</div>

<!-- ── MAIN APP ──────────────────────────────────────────────────── -->
<div id="app">
  <header>
    <div class="header-left">
      <span class="logo">🚀 PumpALERT</span>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Live</span>
      </div>
    </div>
    <div class="header-right">
      <span class="sync-info" id="sync-info">–</span>
      <button class="btn-icon" onclick="refresh()">↻ Refresh</button>
      <button class="btn-icon" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <main>
    <!-- TOP GRID -->
    <div class="grid-top">

      <!-- ── WALLETS PANEL ──────────────────────────────────── -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Tracked Wallets</span>
          <span class="badge" id="wallet-badge">0</span>
        </div>
        <div class="panel-body" id="wallets-list">
          <div class="empty">No wallets yet</div>
        </div>
        <div class="panel-footer">
          <div class="add-form">
            <select id="wallet-owner-select">
              <option value="">Owner</option>
            </select>
            <input id="wallet-addr-input" type="text" placeholder="Wallet address" />
            <button class="btn-add" onclick="addWallet()">Add</button>
          </div>
        </div>
      </div>

      <!-- ── HOLDINGS PANEL ─────────────────────────────────── -->
      <div class="panel">
        <div class="holdings-header">
          <span class="panel-title">Wallet Holdings</span>
          <div class="wallet-selector" id="wallet-tabs">
            <span class="wallet-tab" style="color:var(--text-muted);font-weight:400">Select a wallet</span>
          </div>
        </div>
        <div class="panel-body" id="holdings-list">
          <div class="empty">Select a wallet to see its holdings</div>
        </div>
      </div>

      <!-- ── WATCHLIST PANEL ────────────────────────────────── -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Watchlist</span>
          <span class="badge" id="watchlist-badge">0</span>
        </div>
        <div class="panel-body" id="watchlist-list">
          <div class="empty">No tokens tracked yet</div>
        </div>
        <div class="panel-footer">
          <div class="add-form">
            <input id="token-mint-input" type="text" placeholder="Token contract address (CA)" />
            <button class="btn-add" onclick="addToken()">Add</button>
          </div>
        </div>
      </div>

    </div>

    <!-- ── ALERTS PANEL ───────────────────────────────────── -->
    <div class="alerts-panel">
      <div class="panel-header">
        <span class="panel-title">Recent Alerts</span>
        <span class="badge" id="alerts-badge">0</span>
      </div>
      <div id="alerts-list">
        <div class="empty" style="padding:20px">No alerts yet</div>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
  // ── STATE ────────────────────────────────────────────────────────
  let API_KEY = ''
  let wallets = []
  let watchlist = []
  let alerts = []
  let selectedWalletAddr = null
  let lastSync = null
  let refreshTimer = null

  // ── AUTH ─────────────────────────────────────────────────────────
  function doLogin() {
    const key = document.getElementById('login-input').value.trim()
    if (!key) return
    API_KEY = key
    apiGet('/api/status')
      .then(() => {
        localStorage.setItem('pump_key', key)
        showApp()
      })
      .catch(() => {
        API_KEY = ''
        document.getElementById('login-error').style.display = 'block'
      })
  }

  function logout() {
    localStorage.removeItem('pump_key')
    API_KEY = ''
    document.getElementById('app').style.display = 'none'
    document.getElementById('login-screen').style.display = 'flex'
    if (refreshTimer) clearInterval(refreshTimer)
  }

  function showApp() {
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('app').style.display = 'block'
    refresh()
    refreshTimer = setInterval(refresh, 30000)
  }

  document.getElementById('login-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin()
  })

  // ── API HELPERS ──────────────────────────────────────────────────
  function apiHeaders() {
    return API_KEY ? { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' }
  }

  async function apiGet(path) {
    const res = await fetch(path, { headers: apiHeaders() })
    if (!res.ok) throw new Error(res.status)
    return res.json()
  }

  async function apiPost(path, body) {
    const res = await fetch(path, { method: 'POST', headers: apiHeaders(), body: JSON.stringify(body) })
    if (!res.ok) {
      const err = await res.json().catch(() => ({}))
      throw new Error(err.error || res.status)
    }
    return res.json()
  }

  async function apiDelete(path) {
    const res = await fetch(path, { method: 'DELETE', headers: apiHeaders() })
    if (!res.ok) throw new Error(res.status)
    return res.json()
  }

  // ── REFRESH ──────────────────────────────────────────────────────
  async function refresh() {
    try {
      ;[wallets, watchlist, alerts] = await Promise.all([
        apiGet('/api/wallets'),
        apiGet('/api/watchlist'),
        apiGet('/api/alerts'),
      ])
      renderWallets()
      renderWatchlist()
      renderAlerts()
      renderWalletTabs()
      if (selectedWalletAddr) renderHoldings(selectedWalletAddr)
      lastSync = new Date()
      document.getElementById('sync-info').textContent = 'Synced just now'
      startSyncTimer()
    } catch (err) {
      document.getElementById('sync-info').textContent = 'Sync failed'
      if (String(err).includes('401')) logout()
    }
  }

  function startSyncTimer() {
    if (window._syncCountdown) clearInterval(window._syncCountdown)
    let secs = 30
    window._syncCountdown = setInterval(() => {
      secs--
      if (secs > 0) {
        document.getElementById('sync-info').textContent = `Next sync in ${secs}s`
      }
    }, 1000)
  }

  // ── WALLETS ──────────────────────────────────────────────────────
  function renderWallets() {
    const el = document.getElementById('wallets-list')
    document.getElementById('wallet-badge').textContent = wallets.length
    if (wallets.length === 0) {
      el.innerHTML = '<div class="empty">No wallets yet</div>'
      return
    }
    el.innerHTML = wallets.map(w => `
      <div class="wallet-card ${selectedWalletAddr === w.address ? 'active' : ''}"
           onclick="selectWallet('${w.address}')">
        <div class="wallet-label">${esc(w.label)}</div>
        <div class="wallet-addr">${esc(w.address)}</div>
        <div class="wallet-meta">
          <span class="wallet-count">${w.holdings.length} holdings</span>
          <button class="btn-remove" onclick="event.stopPropagation(); removeWallet('${w.address}')">Remove</button>
        </div>
      </div>
    `).join('')
  }

  function renderWalletTabs() {
    const el = document.getElementById('wallet-tabs')
    if (wallets.length === 0) {
      el.innerHTML = '<span class="wallet-tab" style="color:var(--text-muted);font-weight:400">No wallets</span>'
      return
    }
    el.innerHTML = wallets.map(w => `
      <span class="wallet-tab ${selectedWalletAddr === w.address ? 'active' : ''}"
            onclick="selectWallet('${w.address}')">${esc(w.label)}</span>
    `).join('')
  }

  function selectWallet(addr) {
    selectedWalletAddr = addr
    renderWallets()
    renderWalletTabs()
    renderHoldings(addr)
  }

  function renderHoldings(addr) {
    const el = document.getElementById('holdings-list')
    const wallet = wallets.find(w => w.address === addr)
    if (!wallet) { el.innerHTML = '<div class="empty">Wallet not found</div>'; return }
    const holdings = wallet.holdings
    if (holdings.length === 0) {
      el.innerHTML = '<div class="empty">No token holdings found yet<br><small style="color:var(--text-muted)">Holdings refresh every 60s</small></div>'
      return
    }
    el.innerHTML = holdings.map(h => `
      <div class="token-row">
        <div class="token-icon">${esc((h.symbol || '?').slice(0,3))}</div>
        <div class="token-info">
          <div class="token-name">${esc(h.name || 'Unknown')} <span style="color:var(--text-dim);font-weight:400">$${esc(h.symbol || '?')}</span></div>
          <div class="token-mint">${h.mint.slice(0,20)}...</div>
        </div>
        <div class="token-price">
          <div class="price">${h.price_usd ? '$' + h.price_usd : '–'}</div>
          <div class="mc">${h.market_cap ? fmtNum(h.market_cap) : '–'}</div>
        </div>
        <div style="margin-left:4px">
          <button class="btn-remove" onclick="addToWatchlist('${h.mint}')" title="Add to watchlist">+Watch</button>
        </div>
      </div>
    `).join('')
  }

  async function addWallet() {
    const addrEl = document.getElementById('wallet-addr-input')
    const ownerEl = document.getElementById('wallet-owner-select')
    const address = addrEl.value.trim()
    const label = ownerEl.value

    if (!address || address.length < 32) { toast('Enter a valid Solana address', true); return }
    if (!label) { toast('Select an owner (Nik or Josh)', true); return }

    try {
      await apiPost('/api/wallets', { address, label })
      addrEl.value = ''
      toast(`Wallet added for ${label}`)
      refresh()
    } catch (err) {
      toast(String(err), true)
    }
  }

  async function removeWallet(address) {
    try {
      await apiDelete(`/api/wallets/${address}`)
      if (selectedWalletAddr === address) {
        selectedWalletAddr = null
        document.getElementById('holdings-list').innerHTML = '<div class="empty">Select a wallet</div>'
      }
      toast('Wallet removed')
      refresh()
    } catch (err) {
      toast(String(err), true)
    }
  }

  // ── WATCHLIST ─────────────────────────────────────────────────────
  function renderWatchlist() {
    const el = document.getElementById('watchlist-list')
    document.getElementById('watchlist-badge').textContent = watchlist.length
    if (watchlist.length === 0) {
      el.innerHTML = '<div class="empty">No tokens tracked yet</div>'
      return
    }
    el.innerHTML = watchlist.map(t => `
      <div class="token-row">
        <div class="token-icon">${esc((t.symbol || '?').slice(0,3))}</div>
        <div class="token-info">
          <div class="token-name">
            ${esc(t.name)}
            <span class="tag ${t.source === 'wallet' ? 'tag-wallet' : 'tag-manual'}">
              ${t.source === 'wallet' ? '💼' : '✋'}
            </span>
          </div>
          <div class="token-mint">${t.mint.slice(0,20)}...</div>
        </div>
        <div class="token-price">
          <div class="price">${t.price_usd ? '$' + t.price_usd : '–'}</div>
          <div class="mc">${t.market_cap ? fmtNum(t.market_cap) : '–'}</div>
        </div>
        <button class="btn-remove" onclick="removeToken('${t.mint}')">✕</button>
      </div>
    `).join('')
  }

  async function addToken() {
    const el = document.getElementById('token-mint-input')
    const mint = el.value.trim()
    if (!mint || mint.length < 32) { toast('Enter a valid token CA', true); return }

    try {
      await apiPost('/api/watchlist', { mint })
      el.value = ''
      toast('Token added to watchlist')
      refresh()
    } catch (err) {
      toast(String(err), true)
    }
  }

  async function addToWatchlist(mint) {
    try {
      await apiPost('/api/watchlist', { mint })
      toast('Added to watchlist')
      refresh()
    } catch (err) {
      if (String(err).toLowerCase().includes('already')) {
        toast('Already on watchlist')
      } else {
        toast(String(err), true)
      }
    }
  }

  async function removeToken(mint) {
    try {
      await apiDelete(`/api/watchlist/${mint}`)
      toast('Token removed')
      refresh()
    } catch (err) {
      toast(String(err), true)
    }
  }

  // ── ALERTS ─────────────────────────────────────────────────────────
  function renderAlerts() {
    const el = document.getElementById('alerts-list')
    document.getElementById('alerts-badge').textContent = alerts.length

    if (alerts.length === 0) {
      el.innerHTML = '<div class="empty" style="padding:20px">No alerts fired yet</div>'
      return
    }

    el.innerHTML = alerts.slice(0, 20).map(a => `
      <div class="alert-row">
        <div class="alert-dot"></div>
        <div class="alert-info">
          <div class="alert-token">${esc(a.name)} <span style="color:var(--text-dim)">$${esc(a.symbol)}</span></div>
          <div class="alert-type">${esc(a.alertType)} — <span style="font-family:monospace;font-size:10px">${a.mint.slice(0,16)}...</span></div>
        </div>
        <div class="alert-time">${timeAgo(a.sentAt)}</div>
      </div>
    `).join('')
  }

  // ── OWNER SELECT ─────────────────────────────────────────────────
  async function loadUsers() {
    try {
      const users = await apiGet('/api/users')
      const sel = document.getElementById('wallet-owner-select')
      sel.innerHTML = '<option value="">Owner</option>' +
        users.map(u => `<option value="${esc(u)}">${esc(u.charAt(0).toUpperCase() + u.slice(1))}</option>`).join('')
    } catch {}
  }

  // ── UTILS ──────────────────────────────────────────────────────────
  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  function fmtNum(n) {
    if (!n) return '–'
    if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B'
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M'
    if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K'
    return '$' + n.toFixed(0)
  }

  function timeAgo(ts) {
    const diff = Date.now() - ts
    const s = Math.floor(diff / 1000)
    if (s < 60) return `${s}s ago`
    const m = Math.floor(s / 60)
    if (m < 60) return `${m}m ago`
    const h = Math.floor(m / 60)
    if (h < 24) return `${h}h ago`
    return `${Math.floor(h / 24)}d ago`
  }

  function toast(msg, isError = false) {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.className = 'show' + (isError ? ' error' : '')
    setTimeout(() => { el.className = '' }, 3000)
  }

  // ── INIT ────────────────────────────────────────────────────────────
  ;(function init() {
    const saved = localStorage.getItem('pump_key')
    if (saved) {
      API_KEY = saved
      apiGet('/api/status')
        .then(() => {
          loadUsers().then(showApp)
        })
        .catch(() => {
          API_KEY = ''
          localStorage.removeItem('pump_key')
        })
    }
    // If no DASHBOARD_SECRET is set, the API will accept any key — skip login
    apiGet('/api/status')
      .then(s => {
        if (!API_KEY) {
          // No auth required
          loadUsers().then(showApp)
        }
      })
      .catch(() => {
        // Auth required, show login
        document.getElementById('login-screen').style.display = 'flex'
      })
  })()
</script>

</body>
</html>
