# fly.toml — Fly.io deployment config
# Deploy with: fly launch (first time) or fly deploy (updates)
# Free tier: 3 shared-cpu-1x VMs with 256MB RAM — more than enough

app = "pump-alert"
primary_region = "ord"  # Chicago — close to most Solana validators

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Persistent volume for SQLite database (survives redeploys)
[mounts]
  source = "pump_alert_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # CRITICAL: never sleep
  auto_start_machines = true
  min_machines_running = 1     # always 1 instance alive

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
